[package]
name = "xpa"
version = "0.0.0"
edition = "2024"
# Tracks latest stable, pinned in rust-toolchain.toml.
rust-version = "1.99.0"
description = "Static analyser for XPath expression complexity"
repository = "https://github.com/grahambrooks/xpa"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
